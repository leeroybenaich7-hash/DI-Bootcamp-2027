<!DOCTYPE html>
<!--
============================================================
Week 3 - Day 3 - Exercises XP
Exercise 2 : HTML Form #2
============================================================
Instructions
Use the same form structure as Exercise 1.
When you click the Send button, the form will be submitted with a POST method.
(you can use the same HTML file for the action url)
Where will the sent data appear? Hint : Look at the Network Tab

Answer: with POST, the data does NOT appear in the URL. It is sent in the
body of the HTTP request. We can see it in the Network tab of the inspector :
click on the request -> "Payload" tab -> "Form Data" (name=Leeroy, message=...).
Note: a simple static server (like Live Server) may answer "405 Method Not
Allowed" to a POST, but the request and its form data are still visible
in the Network tab.
============================================================
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Exercise 2 - POST form</title>
</head>
<body>
  <h1>Contact form (POST)</h1>
  <form action="form_post.html" method="POST">
    <label for="name">Name :</label><br>
    <input type="text" id="name" name="name" size="20"><br><br>

    <label for="message">Message :</label><br>
    <textarea id="message" name="message" rows="6" cols="40"></textarea><br><br>

    <input type="submit" value="Send">
  </form>
</body>
</html>
